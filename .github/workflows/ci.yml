name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Node 24 build gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and production bundle
        run: npm run build

      - name: Authorization and migration tests
        run: node scripts/test-backend.mjs

      - name: Production main.js MCP acceptance
        run: node scripts/test-runtime.mjs

      - name: Development connection checker acceptance
        run: node --test scripts/test-connection-check.mjs

      - name: Host validation and HTTP acceptance
        run: node --experimental-strip-types --test tests/hosts.test.mjs tests/hosts-http.test.mjs
